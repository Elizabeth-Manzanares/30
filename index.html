<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Una carrera para ti 🏁❤️</title>
<meta name="theme-color" content="#14161f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--asfalto:#14161f;--naranja:#ff5a00;--llama:#ffc400;--pista:#0a4dff;--blanco:#fff7ea}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--asfalto);color:var(--blanco);font-family:Nunito,system-ui,sans-serif;overflow:hidden;
  background-image:radial-gradient(circle at 50% 120%,rgba(255,90,0,.35),transparent 60%)}
h1,h2,.btn{font-family:Bungee,Impact,sans-serif;font-weight:400}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom))}
.screen.on{display:flex}
.btn{border:0;cursor:pointer;color:var(--asfalto);background:var(--llama);font-size:1.1rem;padding:16px 28px;
  border-radius:14px;box-shadow:0 6px 0 #b98a00;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #b98a00}
.btn:focus-visible{outline:3px solid var(--blanco);outline-offset:3px}
.btn.no{background:var(--blanco);box-shadow:0 6px 0 #b8ad9a}
.btn.no:active{box-shadow:0 1px 0 #b8ad9a}

/* Pantalla 1 */
#inicio h1{font-size:clamp(2rem,9vw,4rem);line-height:1.05;margin-bottom:14px;color:var(--naranja);text-shadow:0 4px 0 #7a2b00}
#inicio p{max-width:30ch;margin-bottom:28px;opacity:.85;font-size:1.05rem}

/* Semáforo */
.semaforo{display:flex;gap:14px;background:#000;padding:16px 20px;border-radius:40px;border:3px solid #333;margin-bottom:22px}
.luz{width:44px;height:44px;border-radius:50%;background:#2a2a2a;transition:background .2s,box-shadow .2s}
.luz.roja{background:#ff2d2d;box-shadow:0 0 22px #ff2d2d}
.luz.verde{background:#2dff6b;box-shadow:0 0 26px #2dff6b}
#cuenta{font-family:Bungee,sans-serif;font-size:2.4rem;min-height:3rem;color:var(--llama)}

/* Pantalla 2 */
#carta{justify-content:flex-start;padding-top:10vh;padding-bottom:150px;overflow-y:auto}
#carta h2{font-size:clamp(1.6rem,7vw,3rem);line-height:1.1;margin-bottom:16px}
#carta h2 span{color:var(--llama)}
.tarjeta{max-width:36ch;font-size:1.1rem;line-height:1.55;background:rgba(255,247,234,.07);
  border:2px solid rgba(255,196,0,.4);border-radius:18px;padding:22px;margin-bottom:26px}
.pregunta{font-family:Bungee,sans-serif;font-size:1.15rem;margin-bottom:16px;color:var(--llama)}
.botones{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;min-height:70px}
#final{margin-top:8px;font-size:1.25rem;font-weight:800;display:none;max-width:28ch}

/* Pista */
.pista{position:fixed;left:0;right:0;bottom:0;height:120px;pointer-events:none;
  background:linear-gradient(var(--pista) 0 10px,transparent 10px),linear-gradient(#1c2030,#0d0f17);
  border-top:4px solid var(--naranja)}
.pista::before{content:"";position:absolute;left:0;right:0;top:64px;height:6px;
  background:repeating-linear-gradient(90deg,var(--llama) 0 34px,transparent 34px 70px);animation:linea .5s linear infinite}
@keyframes linea{to{background-position:-70px 0}}
.coche{position:absolute;bottom:34px;left:-150px;width:130px;animation:pasar 5s linear infinite;will-change:transform}
.coche.derrape{animation:derrape 1.1s ease-in-out infinite;left:calc(50% - 65px)}
@keyframes pasar{to{transform:translateX(calc(100vw + 300px))}}
@keyframes derrape{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg) translateY(-4px)}75%{transform:rotate(7deg) translateY(-2px)}}
.rueda{transform-box:fill-box;transform-origin:center;animation:gira .35s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.llama{transform-origin:right center;animation:llama .12s ease-in-out infinite alternate}
@keyframes llama{to{transform:scaleX(1.5)}}
/* Escena del ramo */
#ramoPantalla{background:radial-gradient(ellipse at 50% 35%,#123f9c 0,#081a4a 55%,#050d26 100%);justify-content:center;gap:4px;overflow:hidden}
#ramoPantalla h2{font-family:Nunito,system-ui,sans-serif;font-weight:800;color:#18b4ff;font-size:clamp(1.7rem,7vw,2.8rem);
  text-shadow:0 0 18px rgba(24,180,255,.55);animation:entra 1.4s ease-out backwards;position:relative;z-index:2}
#ramoTexto{color:#cfe8ff;font-weight:700;font-size:1.1rem;max-width:30ch;min-height:3em;position:relative;z-index:2;animation:entra 1.4s 2.2s ease-out backwards}
@keyframes entra{from{opacity:0;transform:translateY(14px)}}
#ramoSvg{height:min(62vh,470px);width:auto;max-width:96vw;position:relative;z-index:1;overflow:visible}
.b{transform-box:view-box;transform-origin:200px 412px;animation:brota 1.1s cubic-bezier(.2,.9,.3,1.15) backwards;animation-delay:var(--d,0s)}
@keyframes brota{from{transform:scale(.12) translateY(30px);opacity:0}}
.fl{transform-box:fill-box;transform-origin:center;animation:flor .7s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:var(--d,0s)}
@keyframes flor{from{transform:scale(0)}}
#estrellas i{position:absolute;border-radius:50%;background:#fff;opacity:.15;animation:brilla var(--t,3s) ease-in-out infinite;animation-delay:var(--w,0s)}
@keyframes brilla{50%{opacity:.95;transform:scale(1.6)}}
body.ramo .pista{display:none}
@media (prefers-reduced-motion:reduce){.b,.fl,#estrellas i,#ramoPantalla h2,#ramoTexto{animation:none;opacity:1}}
canvas{position:fixed;inset:0;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){.coche,.pista::before,.rueda,.llama{animation:none}.coche{left:calc(50% - 65px)}}
</style>
</head>
<body>

<!-- 1. Inicio -->
<section id="inicio" class="screen on">
  <h1>Tenemos un destino pendiente</h1>
  <p>Prepare algo especial con todo mi corazón. Solo para ti.</p>
  <button class="btn" id="arrancar">Acelerar juntos</button>
</section>

<!-- 2. Semáforo -->
<section id="salida" class="screen">
  <div class="semaforo" aria-hidden="true">
    <div class="luz"></div><div class="luz"></div><div class="luz"></div>
  </div>
  <div id="cuenta" role="status" aria-live="polite"></div>
</section>

<!-- 3. Mensaje -->
<section id="carta" class="screen">
  <h2 id="titulo"></h2>
  <div class="tarjeta" id="mensaje"></div>
  <div class="pregunta" id="pregunta"></div>
  <div class="botones" id="botones">
    <button class="btn" id="si"></button>
    <button class="btn no" id="no"></button>
  </div>
  <div id="final"></div>
</section>

<!-- 4. Ramo -->
<section id="ramoPantalla" class="screen">
  <div id="estrellas" aria-hidden="true"></div>
  <h2 id="ramoTitulo"></h2>
  <svg id="ramoSvg" viewBox="0 0 400 460" role="img" aria-label="Ramo de carritos Hot Wheels en tonos azules">
    <defs>
      <linearGradient id="papel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9ccff"/><stop offset="1" stop-color="#3a72e0"/></linearGradient>
      <linearGradient id="ventana" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf5ff"/><stop offset="1" stop-color="#9fc9f5"/></linearGradient>
      <path id="hoja" d="M0 0 Q-16 -36 0 -78 Q16 -36 0 0Z"/>
      <g id="flor"><ellipse rx="9" ry="16" cy="-10" fill="#2f8cff" transform="rotate(-42)"/><ellipse rx="9" ry="16" cy="-10" fill="#2f8cff" transform="rotate(42)"/><ellipse rx="10" ry="17" cy="-11" fill="#4ea2ff"/><ellipse rx="14" ry="5" fill="#eaf6ff"/></g>
      <symbol id="tarjeta" viewBox="0 0 60 90">
        <rect x="1" y="1" width="58" height="88" rx="5" fill="#dcefff" stroke="#fff" stroke-width="2"/>
        <path d="M1 6Q1 1 6 1H54Q59 1 59 6V24Q30 30 1 22Z" fill="#1d6fff"/>
        <path d="M8 12Q20 4 30 12Q40 20 52 10Q46 22 30 20Q16 18 8 12Z" fill="#ffc400"/>
        <rect x="6" y="32" width="48" height="44" rx="4" fill="#0b2a6b"/>
        <path d="M11 62L13 55Q16 52 22 51L30 49Q35 43 42 44L47 50L52 52Q54 54 54 58L54 62Z" fill="currentColor"/>
        <path d="M32 50Q36 45 41 46L45 50Z" fill="#bfe6ff"/>
        <circle cx="19" cy="63" r="5" fill="#111"/><circle cx="46" cy="63" r="5" fill="#111"/>
        <rect x="6" y="80" width="48" height="4" rx="2" fill="#1d6fff" opacity=".6"/>
      </symbol>
    </defs>
    <g class="b" style="--d:0s"><g transform="rotate(-40 200 420)"><path d="M200 420 L138 190 Q200 150 262 190Z" fill="url(#papel)" stroke="#cfe4ff" stroke-opacity=".6" stroke-width="1.5"/></g><g transform="rotate(40 200 420)"><path d="M200 420 L138 190 Q200 150 262 190Z" fill="url(#papel)" stroke="#cfe4ff" stroke-opacity=".6" stroke-width="1.5"/></g><g transform="rotate(-22 200 420)"><path d="M200 420 L138 190 Q200 150 262 190Z" fill="url(#papel)" stroke="#cfe4ff" stroke-opacity=".6" stroke-width="1.5"/></g><g transform="rotate(22 200 420)"><path d="M200 420 L138 190 Q200 150 262 190Z" fill="url(#papel)" stroke="#cfe4ff" stroke-opacity=".6" stroke-width="1.5"/></g></g>
    <g class="b" style="--d:.3s" stroke="#1f6b2e" stroke-width="4" stroke-linecap="round" fill="none"><path d="M200 412 L200 124"/><path d="M200 412 L139 162"/><path d="M200 412 L261 162"/><path d="M200 412 L98 223"/><path d="M200 412 L302 223"/><path d="M200 412 L168 225"/><path d="M200 412 L232 225"/></g>
    <g class="b" style="--d:0.5s"><use href="#tarjeta" x="40" y="137" width="64" height="96" transform="rotate(-34 72 185)" style="color:#9cb89a"/></g>
      <g class="b" style="--d:0.6s"><use href="#tarjeta" x="296" y="137" width="64" height="96" transform="rotate(34 328 185)" style="color:#e5302a"/></g>
      <g class="b" style="--d:0.7s"><use href="#tarjeta" x="93" y="70" width="64" height="96" transform="rotate(-18 125 118)" style="color:#2fd05a"/></g>
      <g class="b" style="--d:0.8s"><use href="#tarjeta" x="243" y="70" width="64" height="96" transform="rotate(18 275 118)" style="color:#ffb400"/></g>
      <g class="b" style="--d:0.9s"><use href="#tarjeta" x="168" y="30" width="64" height="96" transform="rotate(0 200 78)" style="color:#e5302a"/></g>
      <g class="b" style="--d:1.0s"><use href="#tarjeta" x="130" y="132" width="64" height="96" transform="rotate(-8 162 180)" style="color:#8fa0c8"/></g>
      <g class="b" style="--d:1.1s"><use href="#tarjeta" x="206" y="132" width="64" height="96" transform="rotate(8 238 180)" style="color:#2fd05a"/></g>
      <g class="b" style="--d:.9s">
      <g transform="rotate(-14 200 420)"><path d="M200 420L150 265Q200 235 250 265Z" fill="url(#papel)" stroke="#cfe4ff" stroke-opacity=".6" stroke-width="1.5"/></g>
      <g transform="rotate(14 200 420)"><path d="M200 420L150 265Q200 235 250 265Z" fill="url(#papel)" stroke="#cfe4ff" stroke-opacity=".6" stroke-width="1.5"/></g>
      <path d="M182 392L218 392L212 446L188 446Z" fill="#12306b"/>
    </g>
    <g class="b" style="--d:1.1s"><use href="#hoja" fill="#2a8a3a" transform="translate(200 412) rotate(-80) scale(0.8)"/><use href="#hoja" fill="#37a648" transform="translate(200 412) rotate(-62) scale(1)"/><use href="#hoja" fill="#2f9e3f" transform="translate(200 412) rotate(-44) scale(1.1)"/><use href="#hoja" fill="#43b856" transform="translate(200 412) rotate(-26) scale(1.05)"/><use href="#hoja" fill="#2a8a3a" transform="translate(200 412) rotate(26) scale(1.05)"/><use href="#hoja" fill="#37a648" transform="translate(200 412) rotate(44) scale(1.1)"/><use href="#hoja" fill="#43b856" transform="translate(200 412) rotate(62) scale(1)"/><use href="#hoja" fill="#2f9e3f" transform="translate(200 412) rotate(80) scale(0.8)"/><use href="#hoja" fill="#58c86a" transform="translate(200 412) rotate(-8) scale(0.85)"/><use href="#hoja" fill="#58c86a" transform="translate(200 412) rotate(10) scale(0.95)"/></g>
    <g stroke="#2f9e3f" stroke-width="3" fill="none" stroke-linecap="round"><path d="M200 400Q168 350 150 308"/><path d="M200 400L200 284"/><path d="M200 400Q236 352 256 310"/></g>
    <g class="fl" style="--d:1.6s"><use href="#flor" transform="translate(150 306)"/></g>
    <g class="fl" style="--d:1.8s"><use href="#flor" transform="translate(200 282) scale(1.1)"/></g>
    <g class="fl" style="--d:2s"><use href="#flor" transform="translate(256 310)"/></g>
  </svg>
  <div id="ramoTexto"></div>
</section>

<!-- Pista con carro -->
<div class="pista" aria-hidden="true">
  <svg class="coche" id="coche" viewBox="0 0 200 80">
    <g class="llama"><path d="M18 40 L-6 30 L4 40 L-8 46 L18 48Z" fill="#ffc400"/><path d="M18 41 L4 37 L10 42 L4 45 L18 46Z" fill="#ff5a00"/></g>
    <path d="M18 52 L22 36 Q26 30 44 28 L82 24 Q100 8 128 12 L150 26 L186 32 Q196 36 196 46 L196 54 Z" fill="#ff5a00"/>
    <path d="M92 26 Q104 14 124 16 L140 27 Z" fill="#9fd8ff"/>
    <path d="M40 44 L190 44" stroke="#ffc400" stroke-width="4"/>
    <path d="M60 36 L96 34" stroke="#fff7ea" stroke-width="3" stroke-linecap="round" opacity=".7"/>
    <g class="rueda"><circle cx="54" cy="56" r="16" fill="#111"/><circle cx="54" cy="56" r="8" fill="#ffc400"/><path d="M54 48v16M46 56h16" stroke="#111" stroke-width="3"/></g>
    <g class="rueda"><circle cx="152" cy="56" r="16" fill="#111"/><circle cx="152" cy="56" r="8" fill="#ffc400"/><path d="M152 48v16M144 56h16" stroke="#111" stroke-width="3"/></g>
  </svg>
</div>
<canvas id="confeti"></canvas>

<script>
/* ============ PERSONALIZA AQUÍ ============ */
const CFG = {
  el: "Jock",                 // su nombre
  yo: "Eli",                  // tu nombre
  titulo: "Feliz 30 de Septiembre, mi amor ❤️",
  fotos: ["img/carro2.png", "img/carro4.png", "img/carro3.png", "img/carro7.png", "img/carro6.png", "img/carro5.png", "img/carro1.png"],
  fotoCompleta: false,
  mensaje: "Hoy es el día de los Hot Wheels y no quería dejar pasar esta linda excusa para recordarte lo especial que eres para mí.\n\n" +
           "A tu lado cada momento es una aventura maravillosa y quería sacarte una gran sonrisa hoy.\n\n" +
           "Aceleremos juntos en este camino...",
  pregunta: "¿Aceptas ser mi compañero de ruta para siempre? ❤️",
  textoSi: "¡SIII, mil veces sí!",
  textoNo: "No",
  final: "¡Nuestros corazones van a toda velocidad! 🏁 Eres mi lugar favorito y este ramo es solo para ti. ❤️",
  reto: "¡Ya me anoté! Me toca elegir el carro. 😎"
};
/* =========================================== */

const $ = id => document.getElementById(id);
const pantalla = id => {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  $(id).classList.add("on");
};

$("titulo").innerHTML = `Para mi piloto favorito, <span>${CFG.el}</span> ❤️`;
$("mensaje").textContent = CFG.mensaje + (CFG.yo ? "\n\nCon todo mi amor,\n— " + CFG.yo : "");
$("mensaje").style.whiteSpace = "pre-line";
$("pregunta").textContent = CFG.pregunta;
$("si").textContent = CFG.textoSi;
$("no").textContent = CFG.textoNo;

/* Audio simple de motor (Web Audio, sin archivos) */
let ac;
function motor(dur = 1.1) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(70, ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(420, ac.currentTime + dur);
    g.gain.setValueAtTime(.001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.12, ac.currentTime + .1);
    g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + dur);
    o.connect(g).connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur);
  } catch (e) {}
}

/* Secuencia de salida */
$("arrancar").onclick = () => {
  pantalla("salida");
  const luces = document.querySelectorAll(".luz");
  const txt = $("cuenta");
  let i = 0;
  const paso = setInterval(() => {
    if (i < 3) {
      luces[i].classList.add("roja");
      txt.textContent = 3 - i;
      i++;
    } else {
      clearInterval(paso);
      luces.forEach(l => { l.classList.remove("roja"); l.classList.add("verde"); });
      txt.textContent = "¡AMOR!";
      motor();
      setTimeout(() => { pantalla("carta"); }, 900);
    }
  }, 750);
};

/* Botón "No" que huye */
let intentos = 0;
const no = $("no");
function huir() {
  intentos++;
  if (intentos > 7) { no.style.display = "none"; return; }
  no.style.position = "fixed";
  const m = 20, w = no.offsetWidth, h = no.offsetHeight;
  no.style.left = m + Math.random() * (innerWidth - w - 2 * m) + "px";
  no.style.top = m + Math.random() * (innerHeight - h - 2 * m - 130) + "px";
  if (intentos > 3) no.textContent = "¿Seguro/a?";
  if (intentos > 5) no.textContent = "¡No puedes huir!";
}
no.addEventListener("mouseenter", huir);
no.addEventListener("touchstart", e => { e.preventDefault(); huir(); }, { passive: false });
no.addEventListener("click", huir);

/* Sí: derrape + confeti */
$("si").onclick = () => {
  $("botones").style.display = "none";
  $("pregunta").style.display = "none";
  $("coche").classList.add("derrape");
  motor(1.6);
  lanzarConfeti();
  setTimeout(mostrarRamo, 1500);
};

function mostrarRamo() {
  $("ramoTitulo").textContent = CFG.titulo;
  $("ramoTexto").textContent = CFG.final;
  document.body.classList.add("ramo");
  const e = $("estrellas");
  for (let i = 0; i < 45; i++) {
    const d = document.createElement("i"), t = 1.5 + Math.random() * 3;
    d.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 100}%;width:${1 + Math.random() * 3}px;height:${1 + Math.random() * 3}px;--t:${t}s;--w:${Math.random() * 3}s`;
    e.appendChild(d);
  }
  ponerFotos();
  pantalla("ramoPantalla");
  lanzarConfeti(["#ff2d55", "#8fdcff", "#18b4ff", "#fff7ea"]);
}

/* Fotos en las tarjetas */
function ponerFotos() {
  document.querySelectorAll('#ramoSvg use[href="#tarjeta"]').forEach((u, i) => {
    const src = CFG.fotos[i];
    if (!src) return;
    const x = +u.getAttribute("x"), y = +u.getAttribute("y"), full = CFG.fotoCompleta;
    const NS = "http://www.w3.org/2000/svg";
    if (!full) {
      const v = document.createElementNS(NS, "rect");
      v.setAttribute("x", x + 6.4); v.setAttribute("y", y + 34.1);
      v.setAttribute("width", 51.2); v.setAttribute("height", 46.9); v.setAttribute("rx", 3);
      v.setAttribute("fill", "url(#ventana)");
      v.setAttribute("transform", u.getAttribute("transform"));
      u.parentNode.appendChild(v);
    }
    const im = document.createElementNS(NS, "image");
    im.setAttribute("href", src);
    im.setAttribute("x", full ? x : x + 6.4);
    im.setAttribute("y", full ? y : y + 34.1);
    im.setAttribute("width", full ? 64 : 51.2);
    im.setAttribute("height", full ? 96 : 46.9);
    im.setAttribute("preserveAspectRatio", "xMidYMid meet");
    im.setAttribute("transform", u.getAttribute("transform"));
    if (full) u.style.display = "none";
    u.parentNode.appendChild(im);
  });
}

/* Confeti en canvas */
function lanzarConfeti(cols) {
  const c = $("confeti"), x = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  cols = cols || ["#ff2d55", "#ffc400", "#0a4dff", "#fff7ea"];
  const ps = Array.from({ length: 160 }, () => ({
    x: innerWidth / 2, y: innerHeight * .6,
    vx: (Math.random() - .5) * 16, vy: -Math.random() * 16 - 4,
    s: 5 + Math.random() * 7, r: Math.random() * 6, vr: (Math.random() - .5) * .4,
    c: cols[Math.floor(Math.random() * cols.length)]
  }));
  let t = 0;
  (function frame() {
    x.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => {
      p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r);
      x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore();
    });
    if (++t < 200) requestAnimationFrame(frame); else x.clearRect(0, 0, c.width, c.height);
  })();
}
</script>
</body>
</html>
